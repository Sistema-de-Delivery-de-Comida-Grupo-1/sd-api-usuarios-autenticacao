server.port=8081

spring.application.name=microsservico-usuarios

# Configuração do Banco de Dados em Memória (H2)
spring.datasource.url=jdbc:h2:mem:db_usuarios
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Pede para o Spring (Hibernate) criar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Habilita o console do H2 no navegador para você inspecionar o banco
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/